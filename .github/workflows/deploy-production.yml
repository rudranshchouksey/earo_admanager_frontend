name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          script: |
            set -e

            export TZ="Asia/Kolkata"

            echo ">>> [$(date '+%Y-%m-%d %H:%M:%S')] [frontend] Starting deployment..."

            REPO_DIR="/home/ubuntu/apps/admanager_frontend"

            
            echo "PATH=$PATH"
            which pm2 || true

            echo ">>> Step 1: Navigate to repo"
            cd "$REPO_DIR"

            echo ">>> Pulling latest dev code..."
            git pull --ff-only origin main

            echo ">>> Step 2: Install dependencies"
            npm ci

            echo ">>> Step 3: Build"
            npm run build

            echo ">>> Step 4: Restart PM2"
            /home/ubuntu/.npm-global/bin/pm2 restart earo-app

            echo ">>> [$(date '+%Y-%m-%d %H:%M:%S')] Deployment complete!"

            /home/ubuntu/.npm-global/bin/pm2 list
