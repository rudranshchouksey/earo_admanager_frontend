name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo ">>> [Frontend] Starting deployment..."

            REPO_DIR="/home/ubuntu/apps/admanager_frontend"

            echo ">>> [Frontend] Step 1: Navigate to repo"
            cd "$REPO_DIR"
            git pull

            echo ">>> [Frontend] Step 2: Install dependencies"
            npm ci || npm install

            echo ">>> [Frontend] Step 3: Build"
            npm run build

            echo ">>> [Frontend] Step 4: Serve dist with PM2"
            pm2 restart frontend

            echo ">>> [Frontend] Deployment complete!"
            pm2 list
